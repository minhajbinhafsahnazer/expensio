services:
  - type: web
    name: expensio-backend
    env: node
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm turbo run build --filter expenseflow-backend
    startCommand: pnpm --filter expenseflow-backend run db:migrate && pnpm --filter expenseflow-backend start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
