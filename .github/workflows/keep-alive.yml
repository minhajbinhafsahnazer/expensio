name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 14 minutes
    - cron: '*/14 * * * *'
  # Also allow manual triggering
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Ready Endpoint
        run: curl -sSf https://expensio-backend-bewr.onrender.com/api/v1/ready > /dev/null
        # -sSf means silent, show errors, fail on error
